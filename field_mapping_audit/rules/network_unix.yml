title: File Drop By Authenticated User
id: aaaaaaaa-bbbb-cccc-dddd-000000000004
status: test
logsource:
  product: newlog
  service: file
detection:
  selection:
    UserName: svc_deploy
    ComputerName: build-host-01
    TargetFilename: "/var/tmp/agent.sh"
  host_pattern:
    ComputerName: "build-*"
  condition: selection and host_pattern
fields:
  - UserName
  - ComputerName
  - TargetFilename
falsepositives: []
level: medium
