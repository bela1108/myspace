{% load i18n %}

<div class="pagination">
  {% if previous_cursor %}
    <a href="?{{ page_var }}={{ previous_cursor|urlencode }}">{% trans 'Previous' %}</a>
  {% endif %}
  <span class="current">{{ page_obj.number }}</span>
  {% if next_cursor %}
    <a href="?{{ page_var }}={{ next_cursor|urlencode }}">{% trans 'Next' %}</a>
  {% endif %}
</div>
<p class="pagination-info">
  {{ log_entries|length }} {% blocktranslate count counter=log_entries|length %}entry{% plural %}entries{% endblocktranslate %}
</p>
