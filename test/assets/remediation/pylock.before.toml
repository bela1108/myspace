lock-version = '1.0'
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
requires-python = '>=3.12'
created-by = 'mousebender'

[[packages]]
name = 'appcore'
version = '3.0.0'
dependencies = [
    { name = 'basesettings' },
    { name = 'sharedutils' },
]

[[packages]]
name = 'basesettings'
version = '2.4.0'
dependencies = [{ name = 'legacylib' }]

[[packages]]
name = 'sharedutils'
version = '1.7.0'
dependencies = [
    { name = 'troublemaker' },
    { name = 'legacylib' },
]

[[packages]]
name = 'troublemaker'
version = '0.9.0'
dependencies = [{ name = 'vulnchain' }]

[[packages]]
name = 'vulnchain'
version = '4.0.0'

[[packages]]
name = 'legacylib'
version = '1.0.0'

[[packages]]
name = 'plugintool'
version = '5.2.0'
dependencies = [{ name = 'vulnchain' }]

[[packages]]
name = 'platformextras'
version = '0.3.0'
dependencies = [{ name = 'markerlib', marker = "sys_platform == 'win32'" }]

[[packages]]
name = 'markerlib'
version = '1.2.0'

[groups.plugins]
members = [
    { name = 'plugintool' },
]
